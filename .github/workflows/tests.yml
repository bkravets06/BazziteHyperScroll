name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evdev
        run: pip install evdev
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          for script in install.sh uninstall.sh src/hyperscrollctl; do
            bash -n "$script"
          done
      - name: Extension metadata is valid JSON
        run: python -c "import json;json.load(open('gnome-extension/bazzite-hyperscroll@local/metadata.json'))"
