# Bazzite HyperScroll configuration
# One middle click starts autoscroll; any mouse click stops it.

# Chromium/Edge's Windows autoscroll curve, measured in real screen pixels.
DEADZONE_PX = 15
SPEED_MULT = 0.008
SPEED_EXP = 2.2
MAX_PX_PER_SEC = 30000
PX_PER_NOTCH = 55
MAX_DRAG_PX = 1200
TICK_HZ = 90
NATURAL = false
HORIZONTAL_SCROLL = false

TOGGLE_MODE = true
DESKTOP_SCROLL = false
GHOST_CURSOR = false
REQUIRE_FOCUS_HELPER = true

# Keep native middle-button controls in CAD, slicers, games, and launchers.
BLACKLIST = com.bambulab.bambustudio, bambu-studio, freecad, blender, openscad, librecad, orcaslicer, prusaslicer, cura, autodesk, fusion360, solidworks, minecraft, steam, gamescope, net.lutris.lutris, heroic, prismlauncher, io.itch.itch, protonplus, protontricks

# Empty means every app not listed above. Add comma-separated GNOME app IDs
# here if you later prefer a strict allowlist.
ALLOWLIST =

# Which physical mouse HyperScroll grabs. A name fragment is matched against
# the device name, case-insensitively, so the same entry keeps working in
# every connection mode (2.4 GHz dongle, USB cable, Bluetooth), across
# reboots, and when the event number changes. Only pointer interfaces are
# ever grabbed: keyboard-class devices are refused before this list is even
# consulted, and so are HyperScroll's own virtual mirrors.
#
# Run `hyperscrollctl devices` to see every device, its identifier, and what
# HyperScroll does with it. A path (/dev/input/by-id/...) or a hex
# vendor:product pair works here too, and entries are comma-separated.
ONLY_DEVICES = Viper V3 Pro
EXTRA_DEVICES =
IGNORE_DEVICES =
