    <rect x="85" y="39" width="22" height="12" rx="3"/>

    <rect x="21" y="55" width="13" height="12" rx="3"/>
    <rect x="37" y="55" width="13" height="12" rx="3" fill="#62a0ea"/>
    <rect x="53" y="55" width="13" height="12" rx="3"/>
    <rect x="69" y="55" width="13" height="12" rx="3"/>
    <rect x="85" y="55" width="22" height="12" rx="3"/>

    <rect x="21" y="71" width="18" height="12" rx="3"/>
